features:
  input_mode: physiology_only
  use_gt_maps_as_input: false

dataset:
  sim_root: data/simulated
  split_json_path: data/simulated/splits/train_val_test_split.json
  split_fractions: [0.70, 0.15, 0.15]
  split_seed_offsets: [0, 100000, 200000]
  samples_per_epoch: 8
  seed: 17
  simulation_backend: torch_gpu
  slice_mode: full_volume
  tissue_balanced_patches: false
  n_timepoints: 480
  tr_seconds: 1.55
  paradigms: [block, multi_step, pseudo_random_binary]
  tcnr_levels: [0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0]
  etco2_input: measured
  temporal_mode: full
  transition_alpha: 1.0
  sampling_strategy: random
  randomize_artifacts_for_training: true
  consistency_mode: cross_paradigm
  etco2_noise_sd_mmhg_range: [0.0, 0.40]
  etco2_drift_sd_mmhg_range: [0.0, 0.25]
  drift_fraction_of_noise_range: [0.0, 0.25]
  motion_spike_probability_options: [0.0, 0.005, 0.015, 0.03]
  motion_spike_scale_range: [1.5, 4.0]
  ar1_rho_range: [0.15, 0.55]
  model_mismatch_probability: 0.0
  model_mismatch_strength_range: [0.05, 0.20]

validation:
  samples: 21
  fixed_seeds: true
  checkpoint_metric: label_free_composite
  use_gt_parameter_metrics_for_checkpoint: false

testing:
  fixed_seeds: true
  allow_gt_parameter_metrics: true
  save_predicted_parameter_maps: true

model:
  name: SelfSupervisedCNN1D3DUNet
  architecture: cnn1d_hybrid_3d
  parameterization: direct
  in_channels: auto
  spatial_dims: 3
  base_channels: 24
  depth: 2
  norm: instance
  dropout: 0.05
  temporal_embedding_channels: 48
  # Stage 2 keeps two cross-paradigm graphs; smaller chunks prevent VRAM spikes
  # without changing the full-volume input or temporal information.
  temporal_voxel_chunk_size: 8192
  joint_parameter_head: true
  cvr_residual_head: true
  cvr_residual_channels: 24
  # ln(2): bounded gated multiplicative correction around profiled CVR.
  cvr_log_correction_limit: 0.6931471805599453
  # Broad physiological initialization only; not a GT target or training prior.
  initial_parameter_values: {delay: 25.0, T: 25.0}
  full_volume_inference: true
  T_mode: voxelwise

parameter_ranges:
  cvr_min: 0.0
  cvr_max: 1.8
  delay_min: 0.0
  delay_max: 80.0
  T_min: 2.0
  T_max: 100.0

losses:
  lambda_data: 1.0
  lambda_view: 0.0
  lambda_nuisance: 0.0
  lambda_weak: 0.0
  transition_alpha: 0.0
  student_t_dof: 4.0
  data_scale: 1.0
  view_scale: 1.0
  nuisance_scale: 1.0
  weak_scale: 1.0

optimizer:
  name: AdamW
  lr: 0.0001
  weight_decay: 0.0001

scheduler:
  name: none

training:
  batch_size: 1
  gradient_accumulation_steps: 4
  num_workers: 2
  validation_num_workers: 1
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 1
  use_amp: true
  cudnn_benchmark: true
  allow_tf32: true
  max_epochs: 600
  gradient_clip_norm: 1.0
  save_every_epochs: 10
  validate_every_epochs: 20
  reset_optimizer_on_stage_boundary_resume: true
  resume_if_available: true
  resume_weights_only: false
  allow_partial_resume: false

stages:
  stage_1_identifiable_clean:
    epochs: 200
    lr: 0.001
    tcnr_levels: [2.0, 5.0, 10.0]
    etco2_input: clean
    paradigms: [block, multi_step, pseudo_random_binary]
    consistency_mode: cross_paradigm
    sampling_strategy: balanced_grid
    model_mismatch_probability: 0.0
    etco2_noise_sd_mmhg_range: [0.0, 0.0]
    etco2_drift_sd_mmhg_range: [0.0, 0.0]
    drift_fraction_of_noise_range: [0.0, 0.0]
    motion_spike_probability_options: [0.0]
    motion_spike_scale_range: [0.0, 0.0]
    ar1_rho_range: [0.0, 0.15]
    losses: {data: 1.0, view: 0.0, nuisance: 0.0, weak: 0.0, transition_alpha: 0.0}

  stage_2_mixed_all_conditions:
    epochs: 400
    lr: 0.0005
    tcnr_levels: [0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0]
    tcnr_probabilities: [0.05, 0.05, 0.15, 0.20, 0.20, 0.20, 0.15]
    sampling_strategy: random
    etco2_input: measured
    paradigms: [block, multi_step, pseudo_random_binary]
    consistency_mode: cross_paradigm
    model_mismatch_probability: 0.20
    model_mismatch_strength_range: [0.03, 0.12]
    etco2_noise_sd_mmhg_range: [0.0, 0.40]
    etco2_drift_sd_mmhg_range: [0.0, 0.25]
    drift_fraction_of_noise_range: [0.0, 0.25]
    motion_spike_probability_options: [0.0, 0.005, 0.015]
    motion_spike_scale_range: [1.0, 3.0]
    ar1_rho_range: [0.15, 0.55]
    losses: {data: 1.0, view: 0.05, nuisance: 0.0, weak: 0.0, transition_alpha: 0.0}

checkpoint:
  best_path: data/models/self_supervised_cnn1d_cvr_residual_v1/best.pt
  selection_metric: label_free_composite
