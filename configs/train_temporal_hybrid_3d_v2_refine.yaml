features:
  input_mode: physiology_only
  use_gt_maps_as_input: false

dataset:
  sim_root: data/simulated
  split_json_path: data/simulated/splits/train_val_test_split.json
  split_fractions: [0.70, 0.15, 0.15]
  split_seed_offsets: [0, 100000, 200000]
  samples_per_epoch: 128
  seed: 17
  simulation_backend: torch_gpu
  slice_mode: 3d_patch
  patch_size: [32, 32, 24]
  tissue_balanced_patches: false
  n_timepoints: 480
  tr_seconds: 1.55
  paradigms: [block, multi_step, pseudo_random_binary]
  tcnr_levels: [0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0]
  etco2_input: measured
  temporal_mode: full
  transition_alpha: 1.0
  sampling_strategy: balanced_grid
  randomize_artifacts_for_training: true
  consistency_mode: same_paradigm
  etco2_noise_sd_mmhg_range: [0.0, 0.40]
  etco2_drift_sd_mmhg_range: [0.0, 0.25]
  drift_fraction_of_noise_range: [0.0, 0.25]
  motion_spike_probability_options: [0.0, 0.005, 0.015, 0.03]
  motion_spike_scale_range: [1.5, 4.0]
  ar1_rho_range: [0.15, 0.55]
  model_mismatch_probability: 0.0
  model_mismatch_strength_range: [0.05, 0.20]

validation:
  samples: 63
  fixed_seeds: true
  checkpoint_metric: label_free_composite
  use_gt_parameter_metrics_for_checkpoint: false

testing:
  fixed_seeds: true
  allow_gt_parameter_metrics: true
  save_predicted_parameter_maps: true

model:
  name: SelfSupervisedTemporal3DUNet
  architecture: temporal_hybrid_3d
  parameterization: direct
  in_channels: auto
  spatial_dims: 3
  base_channels: 24
  depth: 2
  norm: instance
  dropout: 0.05
  temporal_embedding_channels: 24
  T_mode: voxelwise

parameter_ranges:
  cvr_min: 0.0
  cvr_max: 1.8
  delay_min: 0.0
  delay_max: 80.0
  T_min: 2.0
  T_max: 100.0

losses:
  lambda_data: 1.0
  lambda_view: 0.0
  lambda_nuisance: 0.001
  lambda_weak: 0.05
  transition_alpha: 1.0
  student_t_dof: 4.0
  data_scale: 1.0
  view_scale: 1.0
  nuisance_scale: 1.0
  weak_scale: 1.0

optimizer:
  name: AdamW
  lr: 0.0001
  weight_decay: 0.0001

scheduler:
  name: none

training:
  batch_size: 32
  gradient_accumulation_steps: 1
  num_workers: 4
  validation_num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 1
  use_amp: true
  max_epochs: 1000
  gradient_clip_norm: 1.0
  save_every_epochs: 5
  validate_every_epochs: 1
  reset_optimizer_on_stage_boundary_resume: true
  resume_if_available: true
  resume_weights_only: false
  allow_partial_resume: false

stages:
  stage_1_identifiable_clean:
    epochs: 200
    lr: 0.001
    tcnr_levels: [5.0, 10.0]
    etco2_input: clean
    paradigms: [block, multi_step, pseudo_random_binary]
    consistency_mode: same_paradigm
    model_mismatch_probability: 0.0
    etco2_noise_sd_mmhg_range: [0.0, 0.0]
    etco2_drift_sd_mmhg_range: [0.0, 0.0]
    drift_fraction_of_noise_range: [0.0, 0.0]
    motion_spike_probability_options: [0.0]
    motion_spike_scale_range: [0.0, 0.0]
    ar1_rho_range: [0.0, 0.15]
    losses: {data: 1.0, view: 0.0, nuisance: 0.0, weak: 0.0, transition_alpha: 0.0}

  stage_2_moderate_noise:
    epochs: 300
    lr: 0.0005
    tcnr_levels: [1.0, 2.0, 5.0, 10.0]
    etco2_input: measured
    paradigms: [block, multi_step, pseudo_random_binary]
    consistency_mode: same_paradigm
    model_mismatch_probability: 0.0
    etco2_noise_sd_mmhg_range: [0.0, 0.20]
    etco2_drift_sd_mmhg_range: [0.0, 0.10]
    drift_fraction_of_noise_range: [0.0, 0.10]
    motion_spike_probability_options: [0.0, 0.005]
    motion_spike_scale_range: [1.0, 2.0]
    ar1_rho_range: [0.1, 0.35]
    losses: {data: 1.0, view: 0.25, nuisance: 0.001, weak: 0.05, transition_alpha: 1.0}

  stage_3_realistic_mixed:
    epochs: 400
    lr: 0.0005
    tcnr_levels: [0.5, 1.0, 2.0, 5.0, 10.0]
    etco2_input: measured
    paradigms: [block, multi_step, pseudo_random_binary]
    consistency_mode: same_paradigm
    model_mismatch_probability: 0.35
    model_mismatch_strength_range: [0.03, 0.18]
    losses: {data: 1.0, view: 0.35, nuisance: 0.002, weak: 0.08, transition_alpha: 1.0}

  stage_4_low_tcnr:
    epochs: 100
    lr: 0.0001
    tcnr_levels: [0.1, 0.2, 0.5]
    etco2_input: measured
    paradigms: [block, multi_step, pseudo_random_binary]
    consistency_mode: same_paradigm
    model_mismatch_probability: 0.35
    model_mismatch_strength_range: [0.03, 0.18]
    losses: {data: 1.0, view: 0.20, nuisance: 0.002, weak: 0.05, transition_alpha: 0.5}

checkpoint:
  best_path: data/models/self_supervised_temporal_3d/best.pt
  selection_metric: label_free_composite
