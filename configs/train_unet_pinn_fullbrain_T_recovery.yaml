features:
  input_mode: minimal
  use_gt_maps_as_input: false

simulation_storage:
  save_full_4d: false
  save_qc_examples: true
  qc_examples_per_paradigm: 1
  training_format: on_the_fly
  cache_feature_maps: false
  cache_full_bold: false

dataset:
  sim_root: data/simulated
  case_index_path: data/simulated/case_index.csv
  split_json_path: data/simulated/splits/train_val_test_split.json
  split_fractions: [0.6, 0.2, 0.2]
  split_seed_offsets: [0, 100000, 200000]
  samples_per_epoch: 1536
  slice_mode: 2d
  slice_axis: axial
  slice_index_range: [0, 93]
  n_timepoints: 480
  tr_seconds: 1.55
  paradigms:
    - block
    - multi_step
    - pseudo_random_binary
    - sinusoidal
    - breath_hold_like
    - resting_state_like
  tcnr_levels: [0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0]
  etco2_input: measured
  temporal_mode: windowed
  temporal_window_length: 240
  temporal_windows_per_sample: 2
  prefer_transition_windows: true
  transition_alpha: 3.0
  sampling_strategy: balanced_grid
  randomize_artifacts_for_training: true
  etco2_noise_sd_mmhg_range: [0.0, 0.40]
  etco2_drift_sd_mmhg_range: [0.0, 0.25]
  drift_fraction_of_noise_range: [0.0, 0.25]
  motion_spike_probability_options: [0.0, 0.005, 0.015, 0.03]
  motion_spike_scale_range: [1.5, 4.0]
  ar1_rho_range: [0.15, 0.55]

validation:
  samples: 84
  fixed_seeds: true
  checkpoint_metric: self_supervised_validation_loss
  use_gt_parameter_metrics_for_checkpoint: false

testing:
  fixed_seeds: true
  allow_gt_parameter_metrics: true
  save_predicted_parameter_maps: true

model:
  name: HybridUNetPINN
  in_channels: auto
  base_channels: 32
  debug_base_channels: 16
  depth: 3
  norm: instance
  dropout: 0.05
  T_mode: voxelwise
  uncertainty: true

parameter_ranges:
  cvr_min: -0.4
  cvr_max: 1.8
  delay_min: 0.0
  delay_max: 80.0
  T_min: 2.0
  T_max: 100.0

losses:
  lambda_recon: 1.0
  lambda_residual: 0.25
  lambda_uncertainty: 0.1
  lambda_smooth: 0.05
  lambda_prior: 0.01
  lambda_consistency: 0.05

optimizer:
  name: AdamW
  lr: 0.0001
  weight_decay: 0.0001

scheduler:
  name: none
  factor: 1.0
  patience: 999999

training:
  use_supervised_parameter_loss: false
  batch_size: 2
  num_workers: 12
  validation_num_workers: 6
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  use_amp: true
  max_epochs: 360
  gradient_clip_norm: 1.0
  save_every_epochs: 5
  validate_every_epochs: 1
  temporal_mode: windowed
  temporal_window_length: 240
  temporal_windows_per_sample: 2
  prefer_transition_windows: true
  reset_optimizer_on_stage_boundary_resume: true

stages:
  stage_1_clean:
    epochs: 40
    tcnr_levels: [5.0, 10.0]
    etco2_input: clean
    paradigms: [block, multi_step]
    temporal_mode: windowed
    temporal_window_length: 240
    T_mode: global
    losses:
      recon: 1.0
      residual: 0.0
      uncertainty: 0.0
      smooth: 0.01
      prior: 0.01
      consistency: 0.0

  stage_2_physics:
    epochs: 80
    tcnr_levels: [1.0, 2.0, 5.0, 10.0]
    etco2_input: measured
    paradigms: [block, multi_step, pseudo_random_binary, breath_hold_like]
    temporal_mode: transition_weighted
    temporal_window_length: 320
    T_mode: tissuewise
    losses:
      recon: 1.0
      residual: 0.6
      uncertainty: 0.0
      smooth: 0.04
      prior: 0.08
      consistency: 0.1

  stage_3_robust:
    epochs: 180
    tcnr_levels: [0.2, 0.5, 1.0, 2.0, 5.0, 10.0]
    etco2_input: measured
    paradigms:
      - block
      - multi_step
      - pseudo_random_binary
      - sinusoidal
      - breath_hold_like
      - resting_state_like
    temporal_mode: mixed
    temporal_window_length: 320
    T_mode: voxelwise
    losses:
      recon: 1.0
      residual: 0.6
      uncertainty: 0.05
      smooth: 0.035
      prior: 0.08
      consistency: 0.15

  stage_4_stress:
    enabled: true
    epochs: 60
    tcnr_levels: [0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0]
    etco2_input: measured
    paradigms:
      - block
      - multi_step
      - pseudo_random_binary
      - sinusoidal
      - breath_hold_like
      - resting_state_like
    temporal_mode: mixed
    temporal_window_length: 320
    T_mode: voxelwise
    losses:
      recon: 1.0
      residual: 0.6
      uncertainty: 0.05
      smooth: 0.035
      prior: 0.08
      consistency: 0.15

checkpoint:
  best_path: data/models/unet_pinn_fullbrain_T_recovery/best.pt
  selection_metric: self_supervised_validation_loss
