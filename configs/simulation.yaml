mida:
  label_map_path: data/raw/MIDA_v1.nii
  output_dir: data/derivatives/mida
  target_shape: [94, 94, 50]
  target_voxel_size_mm: [2.5, 2.5, 2.5]
  downsample_factor: [5, 5, 5]
  target_geometry: mida_centered_2p5mm
  vessel_brain_margin_mm: 3.0
  fill_sigma_mm: 1.0
  brain_support_fraction_threshold: 0.05
  save_fsleyes_canonical: true
  labels:
    wm: [9, 12]
    cortical_gm: [2, 10]
    subcortical_gm: [4, 5, 7, 8, 16, 17, 20, 21, 99, 116]
    vcsf: [6]
    vessel_like: [24, 25]
mida_parameter_maps:
  distribution_path: data/distributions/eroded_iterative_min500/tissue_parameter_samples.parquet
  mida_dir: data/derivatives/mida/2p5mm
  highres_dir: data/derivatives/mida/highres
  output_dir: data/simulated/mida_parameters
  n_cases: 100
  seed: 17
  component_fraction_min: 0.005
  parameter_sampling_mode: joint_3d_mean_std
  sample_quantile_min: 0.0
  sample_quantile_max: 1.0
  subvoxel_samples_per_lowres_voxel: 125
  tissue_bootstrap_samples_per_region: 256
  parameter_patch_size_vox: [1, 1, 1]
  delay_sampling_mode: same_as_parameter
  delay_sample_quantile_min: 0.0
  delay_sample_quantile_max: 1.0
  T_sampling_mode: same_as_parameter
  T_sample_quantile_min: 0.0
  T_sample_quantile_max: 1.0
  parameter_post_smooth_sigma_vox: 0.0
  parameter_post_smooth_blend: 0.0
  spatial_smoothing_sigma_vox: 0.0
  rank_jitter: 0.0
  within_tissue_variation_scale: 0.05
  delay_floor_inside_support_seconds: 1.55
  save_highres_case_indices: []
  save_fsleyes_canonical: true
phantom:
  enabled_when_mida_missing: true
  shape: [32, 32, 8]
  timepoints: 80
  tr_seconds: 1.55
noise_levels_tcnr: [0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0]
mida_bold_simulation:
  parameter_case_dir: data/simulated/mida_parameters/case_000
  output_mode: volume4d
  tcnr_levels: [0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0]
  paradigms: [block, multi_step, pseudo_random_binary]
  slice_indices: []
  n_timepoints: 480
  tr_seconds: 1.55
  seed: 17
  baseline_etco2_mmhg: 40.0
  etco2_noise_sd_mmhg: 0.25
  etco2_drift_sd_mmhg: 0.15
  save_bold_psc_nifti: false
  save_bold_intensity_nifti: true
  save_slice_npz: false
  save_gt_niftis: false
  volume_chunk_voxels: 50000
  max_cases:
  case_start_index: 0
  append_summary: false
  ar1_rho: 0.35
  drift_fraction_of_noise: 0.15
  motion_spike_probability: 0.015
  motion_spike_scale: 3.0
  psc_spatial_smoothing_sigma_vox: 0.0
  baseline_intensity: 320.0
  baseline_bias_sd: 0.0
qc:
  cvr_min: -0.4
  cvr_max: 1.8
  delay_min: 0
  delay_max: 80
  T_min: 2
  T_max: 100
  r2_min: 0.05
  baseline_min: 1e-6
distribution_pooling:
  segmentation_dir: data/derivatives/segmentation
  include_whole_brain: true
  include_boundary_region: true
  max_voxels_per_region_session: 10000
  high_confidence_tissue_interiors: false
  use_core_masks_for_tissue_interiors: false
  erode_tissue_masks_once: false
  erode_tissue_masks_until_too_small: true
  max_tissue_erosion_iterations: 20
  min_eroded_voxels_per_region_session: 500
  min_voxels_per_region_session: 50
  tissue_vessel_likelihood_max_levels: [0.05, 0.10, 0.20, 1.0]
  tissue_boundary_uncertainty_quantile_levels: [0.80, 0.90, 0.95, 1.0]
  tissue_tcnr_min_levels: [0.5, 0.0]
  tissue_r2_min_levels: [0.10, 0.05]
  random_seed: 17
