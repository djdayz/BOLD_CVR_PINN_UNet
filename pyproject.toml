[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-cvr-unet-pinn"
version = "0.1.0"
description = "Self-supervised hybrid U-Net/PINN for BOLD-MRI CVR mapping with an exponential-HRF ODE forward model."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Hybrid CVR Contributors" }]
license = { text = "MIT" }
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "nibabel",
  "nilearn",
  "scikit-image",
  "scikit-learn",
  "torch",
  "torchvision",
  "matplotlib",
  "pyyaml",
  "typer",
  "rich",
  "pydantic",
  "pyarrow",
  "tqdm",
  "joblib",
  "h5py",
  "zarr",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
optional = ["mlflow", "fastapi", "uvicorn"]

[project.scripts]
hybrid-cvr = "hybrid_cvr.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
